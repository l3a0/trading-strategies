# Ruff configuration.
#
# The repo otherwise runs on Ruff defaults; the only override is excluding
# the generated notebook. `covered_call_backtest.ipynb` is a build artifact
# (like the PNGs in docs/figures/) — its real source is the tutorial
# markdown, regenerated by `engine/make_notebook.py` and drift-checked in CI. It
# faithfully mirrors the tutorial's *intentionally* illustrative snippets
# (the Abramowitz & Stegun polynomial that deliberately shadows
# `normal_cdf`; the `run_cc_overlay_day` pseudo-handler that is "illustrative,
# not a function in the codebase"). Linting that generated copy would only
# pressure us to distort teaching code, so it's excluded here. All
# hand-authored .py files across the packages are still linted by `ruff check .`.
extend-exclude = ["covered_call_backtest.ipynb"]

[lint]
# Rule selection is pinned, not inherited.
#
# Ruff 0.16.0 expanded its default rule set from 59 rules to 413. That turned
# a linter bump into 337 findings across this repo with no code change: isort,
# pyupgrade, pylint, bandit, and more, none of which this repo had opted into.
#
# E4, E7, E9, and F are ruff's classic default set. That is the standard this
# repo has always been linted against, so pinning it here preserves the exact
# behaviour while making the choice explicit. A future ruff release can now
# change its defaults without silently changing this repo's standard.
#
# Adopting more rules stays available and is a separate, deliberate change:
# widen this list, clear the findings it raises, and commit both together.
select = ["E4", "E7", "E9", "F"]
